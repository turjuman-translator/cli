# Supported languages. Served by GET /api/languages.
#
# Source (fetched 2026-10-02):
#   Soniox  https://soniox.com/docs/translation/supported-languages
#           60 languages (two-letter codes); "the same supported-language set" for
#           speech-to-text and translation, so every Soniox code is both a source and a
#           translation target. The page shows no last-updated date.
#
# Entry: <code>: { en: English name, native: endonym, soniox: Soniox code }
#   - Sources and targets = the codes in this file (plus "auto" as a source).
# Codes are lowercase ISO 639 (two letters, or three where no two-letter code exists).
# "no" is quoted because YAML 1.1 tools read a bare no as false.
