  - { source: "تبارك وتعالى", target: "﵎" }
  - { source: "عليه السلام", target: "﵇" }
  - { source: "رضي الله عنه", target: "﵁" }
  - { source: "رضي الله عنها", target: "﵂" }
  - { source: "رضي الله عنهم", target: "﵃" }
  - { source: "رحمه الله", target: "﵀" }
